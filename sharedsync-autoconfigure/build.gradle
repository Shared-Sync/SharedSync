plugins {
    id "java-library"
    id "maven-publish"       // ★ 추가
    // wire 스키마 생성물을 테스트가 참조하려면 소스셋이 분리돼야 한다. 같은 컴파일 라운드에서
    // 생성된 타입은 그 라운드의 소스가 참조할 수 없다.
    id "java-test-fixtures"
}

dependencies {
    implementation("org.springframework.boot:spring-boot-autoconfigure")
    implementation("org.springframework.boot:spring-boot-starter-websocket")
    implementation("org.springframework.boot:spring-boot-starter-data-redis")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")
    // spring-boot-starter-security 를 걷어냈다. 쓰던 것은 AccessDeniedException 한 개였는데,
    // 스타터는 클래스만 얹는 게 아니라 시큐리티 자동설정을 켠다 — 프레임워크를 넣었다는 이유로
    // 소비 앱의 HTTP 엔드포인트에 기본 인증이 걸릴 수 있다. SyncAccessDeniedException 으로 대체했다.
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310")

    // protobuf wire 코덱. annotation processor 가 컴파일 시점에 FileDescriptorProto 를 조립하고,
    // 런타임 코덱이 DynamicMessage 로 인코딩한다. protoc 바이너리는 쓰지 않는다 —
    // SharedSync 는 JitPack 에서 소스 빌드되므로 빌드 중 외부 바이너리 내려받기는 깨지기 쉽다.
    api("com.google.protobuf:protobuf-java:4.31.1")

    // 관측성은 선택 의존이다. MeterRegistry 가 있는 앱에서만 메트릭을 등록하고,
    // 없는 앱은 SyncMetrics.NOOP 로 동작한다 — 프레임워크가 액추에이터를 강제하지 않는다.
    compileOnly("io.micrometer:micrometer-core")
    testImplementation("io.micrometer:micrometer-core")

    // 프레임워크가 **자기 애노테이션 프로세서를 자기 테스트에** 적용한다.
    //
    // 이게 없으면 생성 코드(SyncSchema, DTO, 컨트롤러)가 프레임워크 빌드 안에 존재하지 않는다.
    // 그래서 wire 스키마·코덱 테스트가 갈 곳이 소비 앱밖에 없었고, 프레임워크를 고쳐도 소비 앱을
    // 빌드해야 회귀를 알 수 있었다.
    // 프레임워크가 **자기 애노테이션 프로세서를 테스트 픽스처에** 적용한다. 픽스처는 test 보다
    // 먼저 컴파일되므로, 생성된 SyncSchema/DTO 를 테스트가 참조할 수 있다.
    testFixturesAnnotationProcessor files(sourceSets.main.output)
    testFixturesAnnotationProcessor("com.google.protobuf:protobuf-java:4.31.1")
    testFixturesAnnotationProcessor("jakarta.persistence:jakarta.persistence-api:3.1.0")
    // 루트의 BOM 은 implementation 에만 걸려 있어 이 소스셋에는 버전 관리가 미치지 않는다.
    testFixturesImplementation platform("org.springframework.boot:spring-boot-dependencies:3.4.1")

    // 생성 코드(DTO/서비스/저장소/컨트롤러)가 쓰는 것들. main 의 implementation 은 전이되지 않는다.
    testFixturesImplementation("jakarta.persistence:jakarta.persistence-api:3.1.0")
    testFixturesImplementation("org.springframework.boot:spring-boot-starter-websocket")
    testFixturesImplementation("org.springframework.boot:spring-boot-starter-data-redis")
    testFixturesImplementation("org.springframework.boot:spring-boot-starter-data-jpa")
    testFixturesImplementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310")
    testFixturesCompileOnly("org.projectlombok:lombok:1.18.34")
    testFixturesAnnotationProcessor("org.projectlombok:lombok:1.18.34")
    testFixturesApi("com.google.protobuf:protobuf-java:4.31.1")

    // 통합 테스트(AutoCacheRepository DB 경로 검증)용 — 실제 Postgres 연결
    testRuntimeOnly("org.postgresql:postgresql")

}
